name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check bankq tests scripts
      - name: Train (fails the build if the quality gate fails)
        run: python -m bankq.ml.train
      - name: Test
        run: pytest -q
      - name: Upload model card
        uses: actions/upload-artifact@v7
        with:
          name: model-card
          path: models/registry/*/model_card.json

  docker:
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t bankq:ci .
